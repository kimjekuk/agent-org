# VM 실행용 (README "휴대폰에서 쓰기"). 포트는 127.0.0.1에만 열고 Tailscale serve로 내보낸다
name: yt-studio
services:
  app:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "7788"
    ports:
      - "127.0.0.1:7788:7788"
    volumes:
      - ./output:/app/output
    restart: unless-stopped
