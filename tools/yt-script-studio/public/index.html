<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유튜브 대본 스튜디오</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #5f6673; --line: #e2e5ea;
    --accent: #e5322d; --accent-text: #fff; --ok: #1f8a4c; --warn: #b26b00; --chip: #f0f2f5;
    --code: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1a1d23; --text: #eceef2; --muted: #9aa1ad; --line: #2c3038;
      --accent: #ff4d47; --accent-text: #fff; --ok: #4cc584; --warn: #f0a640; --chip: #252931;
      --code: #22262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip.ok { color: var(--ok); } .chip.bad { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea, select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg input { display: none; }
  .seg label { margin: 0; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg input:checked + label { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  .primary { flex: 1; background: var(--accent); color: var(--accent-text); }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost { background: var(--chip); color: var(--text); }
  .small { padding: 6px 10px; font-size: 13px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { padding: 4px 0 4px 26px; position: relative; color: var(--muted); }
  .steps li::before { content: "○"; position: absolute; left: 4px; }
  .steps li.active { color: var(--text); font-weight: 600; }
  .steps li.active::before { content: "◐"; color: var(--warn); animation: spin 1s linear infinite; display: inline-block; }
  .steps li.done::before { content: "●"; color: var(--ok); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { margin-top: 8px; font-size: 14px; } .msg.err { color: var(--accent); font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: -4px -4px 12px; overflow-x: auto; }
  .tabs button { background: none; border-radius: 0; padding: 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .toolbar { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 8px; }
  .videos { display: grid; gap: 10px; }
  .video { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; }
  .video img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--chip); }
  .video a { color: inherit; font-weight: 600; text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video .meta { color: var(--muted); font-size: 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .stats span { background: var(--chip); border-radius: 6px; padding: 0 6px; font-size: 12px; }
  .md { overflow-wrap: anywhere; }
  .md h1, .md h2 { font-size: 17px; margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .md h2:first-child, .md h1:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .md h3 { font-size: 15px; margin: 16px 0 6px; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; min-width: 70px; }
  .md th { background: var(--chip); }
  .md pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  .md code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .md pre code { padding: 0; background: none; }
  .md blockquote { margin: 8px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .empty { color: var(--muted); }
  .foot { color: var(--muted); font-size: 13px; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🎬 유튜브 대본 스튜디오</h1>
  <p class="sub">주제를 넣으면 잘 된 영상을 찾아 분석하고, 영상 제작에 필요한 대본·제목·썸네일·설명란을 한 번에 만듭니다.</p>
  <div class="chips" id="status"><span class="chip">상태 확인 중…</span></div>

  <form class="card" id="form">
    <label for="topic">주제</label>
    <input type="text" id="topic" name="topic" placeholder="예: 50대 영어 회화 독학, 자취 요리, 국내 캠핑 장비" required maxlength="200">

    <label>형식</label>
    <div class="seg">
      <input type="radio" name="format" id="f-shorts" value="shorts" checked><label for="f-shorts">쇼츠</label>
      <input type="radio" name="format" id="f-long" value="long"><label for="f-long">롱폼</label>
    </div>

    <div class="row">
      <div>
        <label for="months">검색 기간</label>
        <select id="months" name="months">
          <option value="3">최근 3개월</option>
          <option value="6">최근 6개월</option>
          <option value="12" selected>최근 1년</option>
          <option value="24">최근 2년</option>
        </select>
      </div>
      <div>
        <label for="count">분석할 영상</label>
        <select id="count" name="count">
          <option value="5">5개</option>
          <option value="8" selected>8개</option>
          <option value="10">10개</option>
        </select>
      </div>
    </div>

    <details>
      <summary>더 자세히 (선택 — 채우면 결과가 좋아져요)</summary>
      <label for="audience">타깃 시청자</label>
      <input type="text" id="audience" name="audience" placeholder="예: 영어 초보인 40~60대 직장인" maxlength="300">
      <label for="channel">내 채널 소개·말투</label>
      <textarea id="channel" name="channel" placeholder="예: 친근한 존댓말, 얼굴 없이 AI 음성 + 자막, 하루 1개 업로드" maxlength="1000"></textarea>
      <label for="extra">추가 요청</label>
      <textarea id="extra" name="extra" placeholder="예: 마지막에 퀴즈 넣기, 과장 표현 금지" maxlength="1000"></textarea>
    </details>

    <div class="actions">
      <button class="primary" id="go" type="submit">분석하고 대본 만들기</button>
      <button class="ghost" id="stop" type="button" hidden>중지</button>
    </div>
    <p class="hint">한 번 실행에 1~3분, Claude 비용 약 1,000원 안팎이 듭니다. YouTube API는 무료 한도(하루 약 45회) 안에서 씁니다.</p>
  </form>

  <section class="card" id="progress" hidden>
    <ol class="steps">
      <li data-step="search">관련 영상 찾기</li>
      <li data-step="analysis">잘 된 이유 분석</li>
      <li data-step="script">대본·제작 자료 작성</li>
    </ol>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card" id="result" hidden>
    <div class="tabs" role="tablist">
      <button type="button" data-tab="script" class="on">제작 패키지</button>
      <button type="button" data-tab="analysis">분석</button>
      <button type="button" data-tab="videos">참고 영상</button>
    </div>
    <div class="toolbar">
      <button type="button" class="ghost small" id="copy">복사</button>
      <button type="button" class="ghost small" id="download">전체 저장(.md)</button>
    </div>
    <div data-pane="script" class="md"><p class="empty">분석이 끝나면 여기에 대본이 나옵니다.</p></div>
    <div data-pane="analysis" class="md" hidden><p class="empty">영상을 찾으면 분석이 시작됩니다.</p></div>
    <div data-pane="videos" hidden><div class="videos" id="videos"></div></div>
    <div class="foot" id="foot"></div>
  </section>
</main>

<script src="/marked.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const state = { videos: [], analysis: "", script: "", topic: "", tab: "script" };
  const nf = new Intl.NumberFormat("ko-KR", { notation: "compact", maximumFractionDigits: 1 });

  // 결과 마크다운 안의 HTML은 실행하지 않고 글자로 보여준다
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  marked.use({ renderer: { html: (t) => esc(t.text ?? t) } });

  // 입력값 기억 (이 브라우저에서만)
  const FIELDS = ["topic", "months", "count", "audience", "channel", "extra"];
  try {
    const saved = JSON.parse(localStorage.getItem("ytss-form") || "{}");
    for (const k of FIELDS) if (saved[k] != null) $("#" + k).value = saved[k];
    if (saved.format) $(`input[name=format][value=${saved.format}]`).checked = true;
  } catch {}

  fetch("/api/status").then((r) => r.json()).then((s) => {
    $("#status").innerHTML = "";
    const chip = (ok, label) => {
      const el = document.createElement("span");
      el.className = "chip " + (ok ? "ok" : "bad");
      el.textContent = (ok ? "✓ " : "✕ ") + label;
      $("#status").append(el);
    };
    chip(s.youtube, "YouTube 키");
    chip(s.claude, "Claude 키");
    const m = document.createElement("span");
    m.className = "chip";
    m.textContent = s.model;
    $("#status").append(m);
  }).catch(() => { $("#status").innerHTML = '<span class="chip bad">서버에 연결되지 않음</span>'; });

  // 탭
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  function showTab(tab) {
    state.tab = tab;
    document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
    document.querySelectorAll("[data-pane]").forEach((p) => (p.hidden = p.dataset.pane !== tab));
    $("#copy").hidden = tab === "videos";
  }

  // 스트리밍 중 렌더링은 프레임당 1번만
  let raf = 0;
  function render() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      if (state.analysis) $('[data-pane="analysis"]').innerHTML = marked.parse(state.analysis);
      if (state.script) $('[data-pane="script"]').innerHTML = marked.parse(state.script);
    });
  }

  function renderVideos() {
    const box = $("#videos");
    box.innerHTML = "";
    state.videos.forEach((v, i) => {
      const el = document.createElement("div");
      el.className = "video";
      el.innerHTML = `<img alt="" loading="lazy"><div><a target="_blank" rel="noopener"></a><div class="meta"></div><div class="stats"></div></div>`;
      el.querySelector("img").src = v.thumbnail;
      const a = el.querySelector("a");
      a.href = v.url;
      a.textContent = `${i + 1}. ${v.title}`;
      el.querySelector(".meta").textContent = `${v.channelTitle} · 구독자 ${nf.format(v.subscribers)} · ${v.publishedAt.slice(0, 10)}`;
      const stats = [
        `조회 ${nf.format(v.views)}`,
        `하루 ${nf.format(v.viewsPerDay)}`,
        `구독자 대비 ${v.outlier.toFixed(1)}배`,
        `참여율 ${(v.engagement * 100).toFixed(1)}%`,
      ];
      for (const s of stats) {
        const sp = document.createElement("span");
        sp.textContent = s;
        el.querySelector(".stats").append(sp);
      }
      box.append(el);
    });
  }

  function setStep(step) {
    const order = ["search", "analysis", "script"];
    const idx = step === "done" ? 3 : order.indexOf(step);
    document.querySelectorAll(".steps li").forEach((li, i) => {
      li.className = i < idx ? "done" : i === idx ? "active" : "";
    });
  }

  function setMsg(text, isErr) {
    const m = $("#msg");
    m.textContent = text;
    m.className = "msg" + (isErr ? " err" : "");
  }

  function fullMarkdown() {
    const refs = state.videos.map((v, i) => `${i + 1}. [${v.title}](${v.url}) — ${v.channelTitle}, 조회수 ${v.views.toLocaleString("ko-KR")}`).join("\n");
    return `# ${state.topic} — 제작 패키지\n\n# 참고한 영상\n\n${refs}\n\n# 경쟁 영상 분석\n\n${state.analysis}\n\n# 제작 패키지\n\n${state.script}\n`;
  }

  $("#copy").addEventListener("click", async () => {
    const text = state.tab === "analysis" ? state.analysis : state.script;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      $("#copy").textContent = "복사됨 ✓";
    } catch {
      $("#copy").textContent = "복사 실패";
    }
    setTimeout(() => ($("#copy").textContent = "복사"), 1500);
  });

  $("#download").addEventListener("click", () => {
    if (!state.analysis && !state.script) return;
    const blob = new Blob([fullMarkdown()], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${state.topic.replace(/[^\p{L}\p{N}]+/gu, "_").slice(0, 40) || "script"}.md`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  let ctl = null;
  $("#stop").addEventListener("click", () => ctl?.abort());

  $("#form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData($("#form")));
    try { localStorage.setItem("ytss-form", JSON.stringify(data)); } catch {}

    Object.assign(state, { videos: [], analysis: "", script: "", topic: data.topic });
    $('[data-pane="analysis"]').innerHTML = '<p class="empty">영상을 찾으면 분석이 시작됩니다.</p>';
    $('[data-pane="script"]').innerHTML = '<p class="empty">분석이 끝나면 여기에 대본이 나옵니다.</p>';
    $("#videos").innerHTML = "";
    $("#foot").textContent = "";
    $("#progress").hidden = false;
    $("#result").hidden = true;
    setStep("search");
    setMsg("");
    $("#go").disabled = true;
    $("#stop").hidden = false;

    ctl = new AbortController();
    try {
      const res = await fetch("/api/run", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(data),
        signal: ctl.signal,
      });
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl);
          buf = buf.slice(nl + 1);
          if (line) handle(JSON.parse(line));
        }
      }
    } catch (e) {
      if (e.name === "AbortError") setMsg("중지했습니다. (이미 쓴 내용은 남아 있어요)");
      else setMsg("서버와 연결이 끊겼습니다: " + e.message, true);
      document.querySelectorAll(".steps li.active").forEach((li) => (li.className = ""));
    } finally {
      $("#go").disabled = false;
      $("#stop").hidden = true;
    }

    function handle(e) {
      switch (e.type) {
        case "step":
          setStep(e.step);
          setMsg(e.message);
          if (e.step === "script") showTab("script");
          break;
        case "videos":
          state.videos = e.videos;
          renderVideos();
          $("#result").hidden = false;
          showTab("analysis");
          $("#foot").textContent = `후보 ${e.candidates}개 중 점수 상위 ${e.videos.length}개를 골랐습니다.`;
          break;
        case "analysis_reset":
          state.analysis = "";
          setMsg(e.message);
          break;
        case "analysis_delta":
          state.analysis += e.text;
          render();
          break;
        case "script_delta":
          state.script += e.text;
          render();
          break;
        case "done":
          setStep("done");
          setMsg(`완료! 예상 비용 약 ${e.krw.toLocaleString("ko-KR")}원 · 서버 폴더에 저장됨: ${e.file}`);
          break;
        case "error":
          setMsg(e.message, true);
          document.querySelectorAll(".steps li.active").forEach((li) => (li.className = ""));
          break;
      }
    }
  });
</script>
</body>
</html>
