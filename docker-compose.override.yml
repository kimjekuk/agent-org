# 로컬 전용. `docker compose up` 시 자동으로 함께 적용된다.
# 운영 서버에서는 이 파일을 쓰지 않는다: docker compose -f docker-compose.yml up -d
#
# 로컬 개발 방식: postgres·redis만 Docker로 띄우고, web·worker는 PC에서 `pnpm dev`로 실행한다.
#   docker compose up -d postgres redis
#   pnpm dev

services:
  postgres:
    ports:
      - "5432:5432" # PC의 pnpm dev, Drizzle Studio에서 접속

  redis:
    ports:
      - "6379:6379"

  web:
    ports:
      - "3000:3000"
